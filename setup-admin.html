<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Active Care - Admin Setup V2 - Local + Cloud</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#F1F5F4;padding:20px}
.box{max-width:440px;margin:50px auto;background:#fff;padding:28px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.1);text-align:center}
.logo{width:70px;height:70px;object-fit:contain}
h1{font-size:22px;margin:10px 0 4px}
p{font-size:13px;color:#6B7C7A;line-height:1.5}
input{width:100%;padding:12px;border:1px solid #E2E8E6;border-radius:10px;font-size:14px;margin-top:10px}
button{width:100%;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:12px}
.btn-pri{background:#0B6B5A;color:#fff}
.btn-ghost{background:#E8EFED;color:#111}
.msg{font-size:13px;margin-top:12px;min-height:20px}
.success{color:#059669}
.error{color:#DC2626}
.warning{background:#FFFBEB;border:1px solid #FDE68A;padding:12px;border-radius:10px;font-size:12px;text-align:left;margin-top:14px}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;background:#D1FAE5;color:#065F46}
.badge-red{background:#FEE2E2;color:#991B1B}
.sync-status{font-size:12px;margin-top:10px;padding:8px;border-radius:8px;background:#F8FAF9}
</style>
</head>
<body>
<div class="box">
  <img src="logo.png" class="logo" onerror="this.style.display='none'">
  <h1>Active Care Pharmacy</h1>
  <p><b>Admin Setup V2 - Local + Cloud</b></p>
  <div id="syncStatus" class="sync-status">Checking Firebase...</div>
  <p id="statusLine" style="margin-top:10px"></p>

  <input id="adminUser" placeholder="Admin Username" value="admin" autocomplete="off" maxlength="30">
  <input id="adminName" placeholder="Admin Full Name" value="Active Care - Admin" maxlength="40">
  <input id="adminPass" type="password" placeholder="New Admin Password - Min 6 chars" autocomplete="new-password" maxlength="50">
  <input id="adminPass2" type="password" placeholder="Confirm New Password" autocomplete="new-password" maxlength="50">
  <button class="btn-pri" onclick="createAdmin()">Create / Reset Admin - Save to Local + Cloud</button>
  <button class="btn-ghost" onclick="goToApp()">Go to Login Page</button>
  <button class="btn-ghost" onclick="loadFromCloudBtn()">Load Admin from Cloud</button>

  <p id="msg" class="msg"></p>

  <div class="warning">
    <b>WHY V2?</b><br>
    V1 saved to Local Storage only - one browser, one device.<br>
    V2 saves to <b>Local + Firebase Cloud</b> - all devices see the same admin.<br><br>
    <b>DELETE this file after success.</b> If you leave it, anyone can reset admin.
  </div>
</div>

<script>
async function hashPass(p, salt){
  let s = salt || 'ac13-' + Math.random().toString(36).slice(2);
  let buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('activecare-v13-' + s + '-' + p));
  let hash = [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  return s + ':' + hash;
}
function getUsers(){
  try{
    let u = JSON.parse(localStorage.getItem('ac13_users')||'[]');
    if(!u.length){ let old = JSON.parse(localStorage.getItem('ac_users')||'[]'); if(old.length) u = old; }
    return u;
  }catch(e){ return []; }
}
function showStatus(){
  let users = getUsers();
  let admin = users.find(x=>x.username && x.username.toLowerCase()==='admin');
  let el = document.getElementById('statusLine');
  if(admin && admin.passHash){
    el.innerHTML = '<span class="badge">Admin Exists - Active (Local)</span><br><small>Username: '+admin.username+' - v'+(admin.passwordVersion||1)+'</small>';
  } else if(admin && !admin.passHash){
    el.innerHTML = '<span class="badge badge-red">Admin Exists - NOT Activated (Local)</span><br><small>Password is empty.</small>';
  } else {
    el.innerHTML = '<span class="badge badge-red">No Admin Found (Local)</span>';
  }
}
function goToApp(){ window.location.href = './index.html'; }
async function createAdmin(){
  let msg = document.getElementById('msg');
  let u = document.getElementById('adminUser').value.trim().toLowerCase();
  let name = document.getElementById('adminName').value.trim() || 'Active Care - Admin';
  let p1 = document.getElementById('adminPass').value;
  let p2 = document.getElementById('adminPass2').value;
  if(!u){ msg.className='msg error'; msg.innerText='Enter admin username'; return; }
  if(!p1 || p1.length < 6){ msg.className='msg error'; msg.innerText='Password min 6 chars'; return; }
  if(p1 !== p2){ msg.className='msg error'; msg.innerText='Passwords do not match'; return; }
  if(!confirm('Create / Reset admin "'+u+'" ? This will save to Local + Cloud.')) return;

  let users = getUsers();
  let idx = users.findIndex(x=>x.username && x.username.toLowerCase()===u);
  let hash = await hashPass(p1);
  if(idx >= 0){
    users[idx].passHash = hash;
    users[idx].passwordVersion = (users[idx].passwordVersion||1) + 1;
    users[idx].fullName = name; users[idx].role='Admin'; users[idx].shift='All';
  } else {
    users.push({id:Date.now(),fullName:name,username:u,passHash:hash,role:'Admin',shift:'All',phone:'',passwordVersion:1});
  }

  // 1. Save Local - always
  localStorage.setItem('ac13_users', JSON.stringify(users));
  try{ localStorage.removeItem('ac_users'); }catch(e){}

  // 2. Save Cloud - if Firebase is ready
  msg.className='msg'; msg.innerText='Saving Local OK... Now saving to Cloud...';
  let cloudOk = false;
  try{
    if(window._db && window._fs){
      // Load current cloud data first, so we don't delete meds/sales
      const {collection, setDoc, doc, getDoc} = window._fs;
      const ref = doc(collection(window._db,'activecare-single'),'data');
      const snap = await getDoc(ref);
      let cloud = snap.exists() ? snap.data() : {};
      // Keep cloud data, replace only users
      await setDoc(ref, {
        ...cloud,
        users: users,
        version: 'V13',
        updatedAt: new Date().toISOString()
      });
      cloudOk = true;
    } else {
      msg.innerText = 'Local saved, but Firebase not ready yet. Wait 3 seconds and try again, or login on this device and click Sync Now in index.html';
    }
  }catch(e){
    console.log('Cloud save failed', e);
    msg.className='msg error';
    msg.innerText = 'Local saved OK, Cloud failed: ' + e.message + ' - Login on THIS device and click Sync Now to push to Cloud.';
    showStatus();
    return;
  }

  if(cloudOk){
    msg.className='msg success';
    msg.innerText = 'SUCCESS! Admin "'+u+'" saved to Local + Cloud. All devices will see it now. DELETE setup-admin.html now!';
  }
  document.getElementById('adminPass').value='';
  document.getElementById('adminPass2').value='';
  showStatus();
}
async function loadFromCloudBtn(){
  let msg = document.getElementById('msg');
  try{
    if(!window._db){ msg.innerText='Firebase not ready yet. Wait a few seconds.'; return; }
    const {collection, getDoc, doc} = window._fs;
    const snap = await getDoc(doc(collection(window._db,'activecare-single'),'data'));
    if(!snap.exists()){ msg.innerText='No cloud data found.'; return; }
    let d = snap.data();
    if(d.users){
      localStorage.setItem('ac13_users', JSON.stringify(d.users));
      msg.className='msg success'; msg.innerText='Loaded '+d.users.length+' users from Cloud to this device. Now login.';
      showStatus();
    } else {
      msg.innerText='Cloud has no users.';
    }
  }catch(e){ msg.className='msg error'; msg.innerText='Load failed: '+e.message; }
}
showStatus();
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, setDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
// PASTE SAME CONFIG AS index.html HERE - MUST BE SAME PROJECT
const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY_HERE",
  authDomain: "PASTE_YOUR_PROJECT.firebaseapp.com",
  projectId: "PASTE_YOUR_PROJECT_ID",
  storageBucket: "PASTE_YOUR_PROJECT.firebasestorage.app",
  messagingSenderId: "PASTE_YOUR_SENDER_ID",
  appId: "PASTE_YOUR_APP_ID"
};
try{
  const app = initializeApp(firebaseConfig);
  window._db = getFirestore(app);
  window._fs = { collection, setDoc, doc, getDoc };
  document.getElementById('syncStatus').innerText = 'Firebase Connected - Will save to Local + Cloud';
  document.getElementById('syncStatus').style.background = '#D1FAE5';
  console.log('Setup V2 Firebase Connected');
}catch(e){
  document.getElementById('syncStatus').innerText = 'Firebase Offline - Will save to Local only. Check config.';
  document.getElementById('syncStatus').style.background = '#FEE2E2';
  console.log('Setup V2 Offline', e);
}
</script>
</body>
</html>
