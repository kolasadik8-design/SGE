<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Active Care - Add Users</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:#F1F5F4;padding:16px;color:#111}
.box{max-width:520px;margin:20px auto;background:#fff;padding:20px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.1)}
h1{font-size:22px;text-align:center}h1 small{display:block;font-size:12px;color:#6B7C7A;margin-top:4px}
input,select{width:100%;padding:12px;border:1px solid #E2E8E6;border-radius:10px;font-size:14px;margin-top:10px}
button{cursor:pointer;border:none;border-radius:10px;padding:12px 14px;font-weight:700;font-size:14px}
.btn-pri{background:#0B6B5A;color:#fff;width:100%;margin-top:12px}
.btn-ghost{background:#E8EFED;color:#111;padding:10px 12px}
.btn-red{background:#DC2626;color:#fff;padding:8px 10px;font-size:12px}
.btn-orange{background:#EA580C;color:#fff;padding:8px 10px;font-size:12px}
.err{color:#DC2626;font-size:13px;margin-top:8px;min-height:18px}
.ok{color:#059669;font-size:13px;margin-top:8px;min-height:18px}
.card{border:1px solid #E2E8E6;border-radius:12px;padding:12px;margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700;background:#DBEAFE;color:#1E40AF}
.tag-green{background:#D1FAE5;color:#065F46}.tag-orange{background:#FFEDD5;color:#9A3412}
a{color:#0B6B5A;font-weight:700}
</style>
</head>
<body>
<div class="box">
<h1>Active Care - Add Users<small>Standalone File - Works even if index.html is broken</small></h1>
<p style="font-size:12px;color:#6B7C7A;text-align:center;margin-top:8px">Users saved here will work in the main system. Same storage: ac13_users + Firebase</p>

<input id="uName" placeholder="Full Name * - e.g. Askf Ahmed" maxlength="40">
<input id="uUser" placeholder="Username * - e.g. askf" maxlength="30" autocomplete="off">
<div style="position:relative"><input id="uPass" type="password" placeholder="Password * - Min 6 chars - e.g. Askf123" maxlength="50" autocomplete="new-password"><button type="button" class="btn-ghost" style="position:absolute;right:6px;top:16px" onclick="let p=document.getElementById('uPass');p.type=p.type==='password'?'text':'password'">Show</button></div>
<p style="font-size:11px;color:#6B7C7A;margin-top:6px">Password length: <b id="passLen">0</b> / 6 minimum</p>
<select id="uRole"><option value="Cashier">Cashier - Sales Only</option><option value="Pharmacist">Pharmacist - Sales + Stock</option><option value="Admin">Admin - Full Access</option></select>
<select id="uShift"><option value="Shift 1">Shift 1 - 08:00 AM to 02:00 PM</option><option value="Shift 2">Shift 2 - 02:00 PM to 08:00 PM</option><option value="Shift 3">Shift 3 - 08:00 PM to 08:00 AM</option><option value="All">All - Admin Only</option></select>
<input id="uPhone" placeholder="Phone (optional)" maxlength="20">
<button class="btn-pri" onclick="addUser()">+ Add User</button>
<p id="err" class="err"></p>
<p id="ok" class="ok"></p>
<p style="font-size:12px;text-align:center;margin-top:10px"><a href="index.html">Back to Main System</a> | <button class="btn-ghost" onclick="location.reload()">Refresh List</button></p>
</div>

<div class="box">
<h3>Existing Users (<span id="count">0</span>)</h3>
<p id="syncStatus" style="font-size:12px;color:#6B7C7A">Local Only</p>
<div id="list"></div>
</div>

<script>
let users = [];
try{ users = JSON.parse(localStorage.getItem('ac13_users')||'[]'); }catch(e){ users=[]; }
if(!users.length){
  users=[{id:1,fullName:'Active Care - Admin',username:'admin',passHash:'',role:'Admin',shift:'All',phone:'',passwordVersion:1}];
  localStorage.setItem('ac13_users',JSON.stringify(users));
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function hashPass(p){
  let s='ac13-'+Math.random().toString(36).slice(2);
  let buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('activecare-v13-'+s+'-'+p));
  let hash=[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  return s+':'+hash;
}
document.getElementById('uPass').addEventListener('input',e=>{document.getElementById('passLen').innerText=e.target.value.length;});
document.getElementById('uRole').addEventListener('change',e=>{
  if(e.target.value==='Admin') document.getElementById('uShift').value='All';
  else if(document.getElementById('uShift').value==='All') document.getElementById('uShift').value='Shift 1';
});
function render(){
  document.getElementById('count').innerText=users.length;
  document.getElementById('list').innerHTML=users.map((u,idx)=>{
    let badge=u.role==='Admin'?'<span class="tag">Admin</span>':u.role==='Pharmacist'?'<span class="tag tag-green">Pharmacist</span>':'<span class="tag tag-orange">Cashier</span>';
    let hasPass=u.passHash&&u.passHash.length>10?'✅ Has Password':'❌ No Password - Needs Setup';
    return `<div class="card"><div><b>${esc(u.fullName)}</b><br><small>@${esc(u.username)} | ${badge} | ${esc(u.shift)} | ${esc(u.phone||'-')}</small><br><small>${hasPass} | v${u.passwordVersion||1}</small></div><div style="display:flex;gap:6px"><button class="btn-orange" onclick="resetPass(${idx})">Reset</button><button class="btn-red" onclick="delUser(${idx})">Del</button></div></div>`;
  }).join('')||'<p>No users</p>';
}
async function addUser(){
  let err=document.getElementById('err');let ok=document.getElementById('ok');
  err.innerText='';ok.innerText='';
  let name=document.getElementById('uName').value.trim();
  let un=document.getElementById('uUser').value.trim().toLowerCase();
  let pw=document.getElementById('uPass').value;
  let role=document.getElementById('uRole').value;
  let sh=document.getElementById('uShift').value;
  let phone=document.getElementById('uPhone').value.trim();
  if(!name){err.innerText='Enter Full Name';return;}
  if(!un){err.innerText='Enter Username';return;}
  if(!pw){err.innerText='Enter Password';return;}
  if(pw.length<6){err.innerText='Password is too short - You wrote '+pw.length+' chars, need at least 6. Example: '+un+'123';return;}
  if(role==='Admin'&&sh!=='All'){err.innerText='Admin must be All shifts';return;}
  if((role==='Cashier'||role==='Pharmacist')&&!['Shift 1','Shift 2','Shift 3'].includes(sh)){err.innerText='Cashier / Pharmacist must be Shift 1, 2 or 3';return;}
  if(users.find(x=>x.username.toLowerCase()===un)){err.innerText='Username "'+un+'" already exists. Try '+un+'1';return;}
  try{
    let h=await hashPass(pw);
    users.push({id:Date.now(),fullName:name,username:un,passHash:h,role:role,shift:sh,passwordVersion:1,phone:phone});
    localStorage.setItem('ac13_users',JSON.stringify(users));
    ok.innerText='User Added: '+name+' (@'+un+') - Password: '+pw+' - Now login in main system with these.';
    document.getElementById('uName').value='';document.getElementById('uUser').value='';document.getElementById('uPass').value='';document.getElementById('uPhone').value='';document.getElementById('passLen').innerText='0';
    render();
    syncToCloud();
  }catch(e){err.innerText='Error: '+e.message;}
}
async function resetPass(idx){
  let np=prompt('Enter NEW password for '+users[idx].fullName+' (min 6 chars):');
  if(!np) return;
  if(np.length<6){alert('Too short - need 6+');return;}
  users[idx].passHash=await hashPass(np);
  users[idx].passwordVersion=(users[idx].passwordVersion||1)+1;
  localStorage.setItem('ac13_users',JSON.stringify(users));
  alert('Password reset! New password: '+np+'\nTell the user to login with it.');
  render();syncToCloud();
}
function delUser(idx){
  if(users[idx].username==='admin'){alert('Cannot delete main admin');return;}
  if(!confirm('Delete '+users[idx].fullName+'?')) return;
  users.splice(idx,1);
  localStorage.setItem('ac13_users',JSON.stringify(users));
  render();syncToCloud();
}
render();
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, setDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyD0j6mn0PEaUvBgsVkE5Xr0Xzr5hXZ-4lQ",
  authDomain: "active-care-pharmacy-71ce2.firebaseapp.com",
  projectId: "active-care-pharmacy-71ce2",
  storageBucket: "active-care-pharmacy-71ce2.firebasestorage.app",
  messagingSenderId: "860436415161",
  appId: "1:860436415161:web:6aaa1ae3bdaec6c1559168"
};
let db=null;
try{ let app=initializeApp(firebaseConfig); db=getFirestore(app); window._db=db; window._fs={collection,setDoc,doc,getDoc}; document.getElementById('syncStatus').innerText='Firebase Connected'; }catch(e){ document.getElementById('syncStatus').innerText='Offline Mode - Local Only (still works)'; }
</script>
<script>
async function syncToCloud(){
  if(!window._db) return;
  try{
    // Load all other data from localStorage to not overwrite it
    let meds=JSON.parse(localStorage.getItem('ac13_meds')||'[]');
    let sales=JSON.parse(localStorage.getItem('ac13_sales')||'[]');
    let returns=JSON.parse(localStorage.getItem('ac13_returns')||'[]');
    let expenses=JSON.parse(localStorage.getItem('ac13_expenses')||'[]');
    let debts=JSON.parse(localStorage.getItem('ac13_debts')||'[]');
    let customers=JSON.parse(localStorage.getItem('ac13_customers')||'[]');
    let suppliers=JSON.parse(localStorage.getItem('ac13_suppliers')||'[]');
    let shiftsLog=JSON.parse(localStorage.getItem('ac13_shifts')||'[]');
    let announces=JSON.parse(localStorage.getItem('ac13_announce')||'[]');
    let exchangeRate=Number(localStorage.getItem('ac13_rate')||4500);
    const {collection,setDoc,doc}=window._fs;
    await setDoc(doc(collection(window._db,'activecare-single'),'data'),{meds,sales,returns,expenses,debts,users,customers,suppliers,shiftsLog,announces,exchangeRate,version:'V13.1',updatedAt:new Date().toISOString()});
    document.getElementById('syncStatus').innerText='Synced ✓ - User is now in Cloud too';
  }catch(e){ document.getElementById('syncStatus').innerText='Sync Failed: '+e.message+' - But user IS saved Locally, will work on this device'; }
}
</script>
</body>
</html>
