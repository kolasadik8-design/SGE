<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PharmaTech Active Care - POS</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#0f172a;color:#e2e8f0}
header{background:#020617;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
header b{font-size:18px}header span{font-size:12px;background:#16a34a;padding:4px 8px;border-radius:20px}
.wrap{display:grid;grid-template-columns:1fr 360px;gap:12px;padding:12px}
.card{background:#1e293b;border-radius:12px;padding:12px}
input,select,button{padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;width:100%;margin:4px 0}
button{background:#2563eb;border:none;cursor:pointer;font-weight:700}button.g{background:#16a34a}button.r{background:#dc2626}button.y{background:#ca8a04;color:#000}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid #334155;text-align:left}
.row{display:flex;gap:8px}.row>*{flex:1}
.badge{font-size:11px;padding:3px 7px;border-radius:20px;background:#334155}
.hide{display:none}.login{max-width:380px;margin:60px auto}
@media(max-width:800px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div><b>💊 PharmaTech Active Care</b><div style="font-size:12px;opacity:.7">Juba - Business Data Only | Users NOT Synced</div></div><span id="syncBadge">🟡 Local Only</span></header>

<div id="loginBox" class="card login">
<h2 style="text-align:center">Login</h2>
<input id="uName" placeholder="Username - admin">
<input id="uPass" type="password" placeholder="Password">
<button onclick="doLogin()">Login</button>
<p style="font-size:12px;opacity:.7;text-align:center">admin / PharmaTech2026! &nbsp; | &nbsp; Demo: pharm1a / Demo1234</p>
<p id="loginMsg" style="color:#f87171;text-align:center"></p>
</div>

<div id="app" class="hide">
<div class="wrap">
<div>
<div class="card">
<h3>🔍 Search / Sell</h3>
<input id="search" placeholder="Type medicine name or barcode..." oninput="renderInv()">
<div id="invList"></div>
</div>
<div class="card" style="margin-top:12px">
<h3>📦 Add New Item</h3>
<div class="row"><input id="nName" placeholder="Medicine Name"><input id="nPrice" type="number" placeholder="Price SSP"></div>
<div class="row"><input id="nQty" type="number" placeholder="Quantity"><input id="nBar" placeholder="Barcode"></div>
<div class="row"><input id="nCat" placeholder="Category"><input id="nExp" type="date"></div>
<button class="g" onclick="addItem()">+ Add to Inventory</button>
</div>
<div class="card" style="margin-top:12px">
<h3>📊 Inventory</h3>
<div id="invTable"></div>
</div>
</div>

<div>
<div class="card">
<h3>🧾 Invoice</h3>
<div><b>Cashier:</b> <span id="curUser"></span> <button class="r" style="width:auto;padding:6px 10px" onclick="logout()">Logout</button></div>
<div id="cart"></div>
<hr>
<div class="row"><input id="disc" type="number" placeholder="Discount SSP" value="0" oninput="renderCart()"><select id="payMethod"><option>Cash</option><option>Mobile Money</option><option>Card</option></select></div>
<h2>Total: <span id="total">0</span> SSP</h2>
<button class="g" onclick="checkout()">✅ Complete Sale & Print</button>
<button class="y" onclick="clearCart()">Clear Invoice</button>
</div>
<div class="card" style="margin-top:12px">
<h3>📈 Today</h3>
<div>Today Sales: <b id="todaySales">0</b> SSP</div>
<div>Invoices: <b id="todayCount">0</b></div>
<div>Items Count: <b id="itemCount">0</b></div>
<button onclick="exportBackup()">⬇️ Download Backup</button>
<button onclick="seedDemo()">🧪 Add Demo Items</button>
<p id="fbStatus" style="font-size:12px"></p>
</div>
</div>
</div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getFirestore, collection, setDoc, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const FB_CONFIG = {
  apiKey: "AIzaSyAJeu6fPQuTd7kIBngbH7LxZnCKRQGXCk0",
  authDomain: "juba-stadium-247f3.firebaseapp.com",
  projectId: "juba-stadium-247f3",
  storageBucket: "juba-stadium-247f3.firebasestorage.app",
  messagingSenderId: "314725857339",
  appId: "1:314725857339:web:552d953c9e6a3f0097841e"
};

let db=null, cloudReady=false;
try{
  const app = initializeApp(FB_CONFIG);
  db = getFirestore(app);
  cloudReady=true;
  document.getElementById('syncBadge').innerText='🟢 Online - Synced';
  document.getElementById('fbStatus').innerText='Connected - Project: '+FB_CONFIG.projectId+' - Users NOT synced';
}catch(e){ console.log('Firebase failed',e); }

let items = JSON.parse(localStorage.getItem('pt_items')||'[]');
let sales = JSON.parse(localStorage.getItem('pt_sales')||'[]');
let cart = [];
let currentUser = null;

const USERS = [
  {u:'admin', p:'PharmaTech2026!', role:'admin'},
  {u:'pharm1a', p:'Demo1234', role:'pharmacist'},
  {u:'cashier1', p:'Demo1234', role:'cashier'}
];

async function saveLocal(){
  localStorage.setItem('pt_items', JSON.stringify(items));
  localStorage.setItem('pt_sales', JSON.stringify(sales));
  if(cloudReady && db){
    try{
      await setDoc(doc(collection(db,'pharmatech-activecare'),'main'), {items, sales, updatedAt: Date.now()});
      document.getElementById('syncBadge').innerText='🟢 Online - Synced';
    }catch(e){ console.log('sync fail',e); }
  }
}

async function loadFromCloud(){
  if(!cloudReady || !db) return;
  try{
    const snap = await getDoc(doc(collection(db,'pharmatech-activecare'),'main'));
    if(snap.exists()){
      const d = snap.data();
      if(d.items && d.items.length>items.length){ items=d.items; sales=d.sales||[]; localStorage.setItem('pt_items',JSON.stringify(items)); localStorage.setItem('pt_sales',JSON.stringify(sales)); }
    }
  }catch(e){}
}
loadFromCloud();

window.doLogin = function(){
  const u=document.getElementById('uName').value.trim();
  const p=document.getElementById('uPass').value;
  const f=USERS.find(x=>x.u===u && x.p===p);
  if(!f){ document.getElementById('loginMsg').innerText='Wrong credentials'; return; }
  currentUser=f;
  document.getElementById('loginBox').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  document.getElementById('curUser').innerText=u+' ('+f.role+')';
  renderInv(); renderCart(); renderStats();
}
window.logout=function(){ location.reload(); }

window.renderInv=function(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const list=document.getElementById('invList');
  const filt=items.filter(i=>i.name.toLowerCase().includes(q)||(i.bar||'').includes(q));
  list.innerHTML = filt.slice(0,20).map((i,idx)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid #334155"><div><b>${i.name}</b><br><span class="badge">${i.cat||''} | Exp: ${i.exp||'-'} | Stock: ${i.qty}</span></div><div><b>${i.price} SSP</b><br><button class="g" style="width:auto" onclick="addToCart('${i.id}')">+ Add</button></div></div>`).join('') || '<p style="opacity:.6">No items - Add new item</p>';
  document.getElementById('invTable').innerHTML=`<table><tr><th>Item</th><th>Price</th><th>Qty</th><th></th></tr>${items.map(i=>`<tr><td>${i.name}<br><small>${i.bar||''}</small></td><td>${i.price}</td><td>${i.qty}</td><td><button class="r" style="width:auto;padding:5px 8px" onclick="delItem('${i.id}')">Delete</button></td></tr>`).join('')}</table>`;
  document.getElementById('itemCount').innerText=items.length;
}
window.addItem=function(){
  const name=document.getElementById('nName').value.trim();
  const price=+document.getElementById('nPrice').value||0;
  const qty=+document.getElementById('nQty').value||0;
  if(!name||!price){ alert('Enter name and price'); return; }
  items.push({id:Date.now().toString(), name, price, qty, bar:document.getElementById('nBar').value, cat:document.getElementById('nCat').value, exp:document.getElementById('nExp').value});
  ['nName','nPrice','nQty','nBar','nCat'].forEach(id=>document.getElementById(id).value='');
  saveLocal(); renderInv();
}
window.delItem=function(id){ if(confirm('Delete this item?')){ items=items.filter(i=>i.id!==id); saveLocal(); renderInv(); } }

window.addToCart=function(id){
  const it=items.find(i=>i.id===id); if(!it||it.qty<=0){ alert('Out of stock'); return; }
  const ex=cart.find(c=>c.id===id);
  if(ex) ex.qty++; else cart.push({id:it.id,name:it.name,price:it.price,qty:1});
  renderCart();
}
window.renderCart=function(){
  const disc=+document.getElementById('disc').value||0;
  let tot=0;
  document.getElementById('cart').innerHTML=cart.map(c=>{ tot+=c.price*c.qty; return `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #334155"><span>${c.name} x ${c.qty}</span><span>${c.price*c.qty} <button class="r" style="width:auto;padding:2px 6px" onclick="remCart('${c.id}')">x</button></span></div>`}).join('') || '<p style="opacity:.6">Invoice is empty</p>';
  document.getElementById('total').innerText=Math.max(0, tot-disc);
}
window.remCart=function(id){ cart=cart.filter(c=>c.id!==id); renderCart(); }
window.clearCart=function(){ cart=[]; renderCart(); }
window.checkout=function(){
  if(!cart.length){ alert('Invoice is empty'); return; }
  const disc=+document.getElementById('disc').value||0;
  let tot=cart.reduce((s,c)=>s+c.price*c.qty,0)-disc;
  cart.forEach(c=>{ const it=items.find(i=>i.id===c.id); if(it) it.qty-=c.qty; });
  sales.push({id:Date.now(), total:tot, items:cart, pay:document.getElementById('payMethod').value, user:currentUser?.u||'admin', date:new Date().toISOString()});
  cart=[]; document.getElementById('disc').value=0;
  saveLocal(); renderInv(); renderCart(); renderStats();
  alert('Sale completed ✅ - Total '+tot+' SSP');
  window.print();
}
window.renderStats=function(){
  const today=new Date().toISOString().slice(0,10);
  const t=sales.filter(s=>s.date.slice(0,10)===today);
  document.getElementById('todaySales').innerText=t.reduce((s,x)=>s+x.total,0);
  document.getElementById('todayCount').innerText=t.length;
}
window.exportBackup=function(){
  const blob=new Blob([JSON.stringify({items,sales},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='pharmatech-backup.json'; a.click();
}
window.seedDemo=function(){
  if(items.length) { if(!confirm('You already have items - add demo too?')) return; }
  items=[
    {id:'1',name:'Paracetamol 500mg',price:500,qty:100,bar:'123',cat:'Pain',exp:'2027-01-01'},
    {id:'2',name:'Amoxicillin 500mg',price:1500,qty:50,bar:'124',cat:'Antibiotic',exp:'2026-12-01'},
    {id:'3',name:'Vitamin C 1000mg',price:2000,qty:30,bar:'125',cat:'Vitamins',exp:'2027-06-01'},
    {id:'4',name:'Omeprazole 20mg',price:1200,qty:40,bar:'126',cat:'Stomach',exp:'2026-11-01'}
  ];
  saveLocal(); renderInv(); alert('Demo items added ✅');
}
renderInv(); renderStats();
</script>
</body>
  </html>
