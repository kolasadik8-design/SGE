<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Active Care Pharmacy</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5658B5">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<style>
:root{--main:#5658B5;--main-dark:#43459a;--bg:#eef0ff;--card:#fff;--text:#1e1e3a;--muted:#6b7280;--green:#16a34a;--red:#dc2626;--orange:#ea580c}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--main);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo-wrap img{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:10px;padding:3px}
.logo-wrap b{font-size:19px;line-height:1} .logo-wrap small{font-size:11px;opacity:.9}
.badge{background:#fff;color:var(--main);padding:5px 12px;border-radius:20px;font-size:12px;font-weight:800}
nav{display:flex;gap:6px;padding:10px;background:#fff;overflow:auto;position:sticky;top:0;z-index:5}
nav button{border:0;background:#eef0ff;color:var(--main);padding:10px 14px;border-radius:12px;font-weight:700;white-space:nowrap;cursor:pointer}
nav button.active{background:var(--main);color:#fff}
main{padding:12px;max-width:1150px;margin:auto}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
input,select{width:100%;padding:11px;border:1.5px solid #d1d5db;border-radius:12px;margin:5px 0;font-size:15px}
input:focus,select:focus{outline:2px solid var(--main)}
.btn-primary{background:var(--main);color:#fff;border:0;padding:12px;border-radius:12px;font-weight:800;width:100%;cursor:pointer;font-size:15px}
.btn-ghost{background:#eef0ff;color:var(--main);border:0;padding:9px 12px;border-radius:10px;font-weight:700;cursor:pointer}
.btn-danger{background:var(--red);color:#fff;border:0;padding:9px 12px;border-radius:10px;font-weight:700;cursor:pointer}
.hidden{display:none!important} .row{display:flex;gap:8px} .row>*{flex:1}
.kpi{display:flex;gap:8px;text-align:center} .kpi>div{flex:1;padding:12px;border-radius:14px;font-weight:700}
.text-red{color:var(--red);font-weight:800} .text-orange{color:var(--orange);font-weight:800}
</style>
</head>
<body>
<header><div class="logo-wrap"><img src="logo.png" alt="Active Care" onerror="this.style.display='none'"><div><b>ACTIVE CARE</b><br><small>PHARMACY | Juba</small></div></div><span class="badge" id="shiftBadge">Juba Time</span></header>
<div id="loginPage" style="max-width:420px;margin:32px auto;padding:0 12px"><div class="card" style="text-align:center"><img src="logo.png" style="width:120px;height:120px;object-fit:contain" onerror="this.style.display='none'"><h2 style="color:var(--main)">Welcome Back</h2><p style="color:var(--muted)">Morning 8-2 | Evening 2-9 | Juba Time</p><input id="loginUser" placeholder="Username" value="admin"><input id="loginPass" type="password" placeholder="Password" value="GraceAdmin@2026!"><select id="loginShift"><option value="Morning">Morning Shift</option><option value="Evening">Evening Shift</option></select><button class="btn-primary" onclick="doLogin()">Login</button><p id="loginMsg" style="color:var(--red)"></p></div></div>
<div id="app" class="hidden">
<nav>
<button onclick="showPage('pos',this)" class="active">POS</button>
<button onclick="showPage('returns',this)">Returns</button>
<button onclick="showPage('stock',this)">Stock</button>
<button onclick="showPage('reports',this)">Reports</button>
<button onclick="showPage('expenses',this)">Expenses</button>
<button onclick="showPage('debts',this)">Debts</button>
<button onclick="showPage('purchase',this)">Purchase Order</button>
</nav>
<main>
<div id="page-pos" class="card"><h3>Point of Sale</h3><input id="posSearch" placeholder="Search by name or barcode..." oninput="renderPOS()"><div id="posList"></div><hr><h4>Cart</h4><div id="cartList">Cart is empty</div><div class="row"><input id="posDiscount" type="number" placeholder="Discount"><input id="posPaid" type="number" placeholder="Amount Paid"></div><button class="btn-primary" onclick="checkout()">Complete Sale</button></div>
<div id="page-returns" class="card hidden"><h3>Returns - Customer Return</h3><input id="returnSearch" placeholder="Search sale by date or medicine..." oninput="renderReturns()"><div id="returnsList"></div><hr><h4>Manual Return</h4><div class="row"><input id="retName" placeholder="Medicine Name"><input id="retQty" type="number" placeholder="Qty to Return"></div><input id="retReason" placeholder="Reason: Expired / Wrong / Damaged / Changed Mind"><button class="btn-primary" onclick="manualReturn()">Process Return</button><div id="returnsHistory" style="margin-top:12px"></div></div>
<div id="page-stock" class="card hidden"><h3>Stock - Add Medicine</h3><div class="row"><input id="mName" placeholder="Medicine Name"><input id="mPrice" type="number" placeholder="Price (SSP)"></div><div class="row"><input id="mQty" type="number" placeholder="Quantity"><input id="mExpiry" type="date"></div><input id="mBarcode" placeholder="Barcode (Optional)"><button class="btn-primary" onclick="addMed()">Add Medicine</button><hr><div id="stockList"></div></div>
<div id="page-reports" class="card hidden"><h3>Reports</h3><div class="row"><input id="repFrom" type="date"><input id="repTo" type="date"></div><button class="btn-primary" onclick="renderReports()">Show Reports</button><canvas id="monthlyChart" style="width:100%;height:220px;margin-top:12px"></canvas><div id="reportsOut"></div><div id="monthlyCalendar"></div></div>
<div id="page-expenses" class="card hidden"><h3>Expenses</h3><div class="row"><input id="eName" placeholder="Description"><input id="eAmt" type="number" placeholder="Amount"></div><button class="btn-primary" onclick="addExpense()">Add Expense</button><div id="expList" style="margin-top:10px"></div></div>
<div id="page-debts" class="card hidden"><h3>Debts</h3><div class="row"><input id="dName" placeholder="Customer Name"><input id="dAmt" type="number" placeholder="Amount"></div><button class="btn-primary" onclick="addDebt()">Add Debt</button><div id="debtsList" style="margin-top:10px"></div></div>
<div id="page-purchase" class="card hidden"><h3>Purchase Order</h3><div id="poRows"></div><button class="btn-ghost" onclick="soAddRow()">Add Row</button><button class="btn-primary" onclick="saveSalesOrder()" style="margin-top:10px">Save to Stock</button></div>
<div class="card"><h3>Alerts - 60 Days</h3><div id="alertsBox"></div></div>
<button class="btn-danger" onclick="closeShift()">Close Shift</button>
</main></div>
<script>
let meds=JSON.parse(localStorage.getItem('ac_meds')||'[]');
let sales=JSON.parse(localStorage.getItem('ac_sales')||'[]');
let returns=JSON.parse(localStorage.getItem('ac_returns')||'[]');
let expenses=JSON.parse(localStorage.getItem('ac_expenses')||'[]');
let debts=JSON.parse(localStorage.getItem('ac_debts')||'[]');
let cart=[];
function saveAll(){localStorage.setItem('ac_meds',JSON.stringify(meds));localStorage.setItem('ac_sales',JSON.stringify(sales));localStorage.setItem('ac_returns',JSON.stringify(returns));localStorage.setItem('ac_expenses',JSON.stringify(expenses));localStorage.setItem('ac_debts',JSON.stringify(debts));}
function showPage(id,btn){document.querySelectorAll('main > div.card').forEach(d=>d.classList.add('hidden'));document.getElementById('page-'+id).classList.remove('hidden');document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');if(id==='pos')renderPOS();if(id==='returns')renderReturns();if(id==='stock')renderStock();if(id==='reports')renderReports();if(id==='expenses')renderExpenses();if(id==='debts')renderDebts();if(id==='purchase')renderPO();}
function doLogin(){let u=document.getElementById('loginUser').value.trim();let p=document.getElementById('loginPass').value;let s=document.getElementById('loginShift').value;if(u==='admin'&&p==='GraceAdmin@2026!'){document.getElementById('loginPage').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('shiftBadge').textContent=s+' | '+new Date().toLocaleString('en-GB',{timeZone:'Africa/Juba'});localStorage.setItem('ac_shift',s);init();}else{document.getElementById('loginMsg').textContent='Wrong username or password';}}
function renderPOS(){let q=(document.getElementById('posSearch').value||'').toLowerCase();let list=meds.filter(m=>m.name.toLowerCase().includes(q)||(m.barcode||'').includes(q));document.getElementById('posList').innerHTML=list.map(m=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #eef0ff"><div><b>${m.name}</b><br><small style="color:#6b7280">${m.price} SSP | Stock: ${m.qty} | ${getExpiryStatus(m)}</small></div><button class="btn-ghost" onclick="addToCart('${m.id}')">Add</button></div>`).join('')||'No results';renderCart();}
function addToCart(id){let m=meds.find(x=>String(x.id)===String(id));if(!m)return;if(getExpiryStatus(m).includes('Expired')){alert('This medicine is expired - Sale blocked');return;}if(m.qty<=0){alert('Out of stock');return;}let it=cart.find(c=>String(c.id)===String(id));if(it)it.qty++;else cart.push({id:m.id,name:m.name,price:m.price,qty:1});renderCart();}
function renderCart(){if(!cart.length){document.getElementById('cartList').innerHTML='Cart is empty';return;}let total=cart.reduce((s,c)=>s+c.price*c.qty,0);document.getElementById('cartList').innerHTML=cart.map((c,i)=>`<div style="display:flex;justify-content:space-between;padding:6px 0">${c.name} x ${c.qty} = ${c.price*c.qty} SSP <button class="btn-danger" style="padding:4px 8px" onclick="cart.splice(${i},1);renderCart()">X</button></div>`).join('')+`<b>Total: ${total} SSP</b>`;}
function checkout(){if(!cart.length)return alert('Cart is empty');let disc=Number(document.getElementById('posDiscount').value||0);let paid=Number(document.getElementById('posPaid').value||0);let total=cart.reduce((s,c)=>s+c.price*c.qty,0)-disc;cart.forEach(c=>{let m=meds.find(x=>String(x.id)===String(c.id));if(m)m.qty-=c.qty;});sales.push({id:Date.now(),date:new Date().toISOString().slice(0,10),items:cart,total,discount:disc,paid,shift:localStorage.getItem('ac_shift')||'Morning',status:'Completed'});cart=[];saveAll();renderPOS();renderStock();alert('Sale completed - Total: '+total+' SSP');}
function renderReturns(){let q=(document.getElementById('returnSearch').value||'').toLowerCase();let list=sales.filter(s=>s.date.includes(q)||s.items.some(i=>i.name.toLowerCase().includes(q)));document.getElementById('returnsList').innerHTML=list.slice(-20).reverse().map(s=>`<div style="padding:10px 0;border-bottom:1px solid #eef0ff"><div style="display:flex;justify-content:space-between"><b>Sale #${s.id} - ${s.date}</b><b>${s.total} SSP</b></div><small>${s.items.map(i=>i.name+' x'+i.qty).join(', ')} | Status: ${s.status||'Completed'}</small><br>${s.status!=='Returned'?`<button class="btn-ghost" onclick="returnFullSale('${s.id}')">Return Full Sale</button> <button class="btn-ghost" onclick="returnItemSale('${s.id}')">Return One Item</button>`:'<span class="text-red">Already Returned</span>'}</div>`).join('')||'No sales found';document.getElementById('returnsHistory').innerHTML='<h4>Return History</h4>'+returns.map(r=>`<div style="padding:6px 0;border-bottom:1px solid #eee">${r.date} - ${r.name} x ${r.qty} - ${r.refund} SSP - Reason: ${r.reason}</div>`).join('')||'No returns yet';}
function returnFullSale(saleId){let s=sales.find(x=>String(x.id)===String(saleId));if(!s)return;if(!confirm('Return full sale #'+saleId+' ? Stock will increase and sale will be cancelled.'))return;s.items.forEach(it=>{let m=meds.find(x=>String(x.id)===String(it.id));if(m)m.qty+=it.qty;});s.status='Returned';returns.push({id:Date.now(),date:new Date().toISOString().slice(0,10),name:s.items.map(i=>i.name).join(', '),qty:s.items.reduce((a,i)=>a+i.qty,0),refund:s.total,reason:'Full Sale Return',saleId:s.id});saveAll();renderReturns();renderPOS();renderStock();alert('Full sale returned - Refund: '+s.total+' SSP');}
function returnItemSale(saleId){let s=sales.find(x=>String(x.id)===String(saleId));if(!s)return;let name=prompt('Which item to return? Write name:\n'+s.items.map(i=>i.name).join(', '));let item=s.items.find(i=>i.name.toLowerCase()===String(name||'').toLowerCase());if(!item)return alert('Item not found');let qty=Number(prompt('How many to return? Max: '+item.qty,1));if(!qty||qty>item.qty)return alert('Invalid quantity');let reason=prompt('Reason:','Customer Changed Mind')||'Customer Changed Mind';let m=meds.find(x=>String(x.id)===String(item.id));if(m)m.qty+=qty;item.qty-=qty;s.total-=item.price*qty;if(s.items.every(i=>i.qty===0))s.status='Returned';returns.push({id:Date.now(),date:new Date().toISOString().slice(0,10),name:item.name,qty,refund:item.price*qty,reason,saleId:s.id});saveAll();renderReturns();renderPOS();renderStock();alert('Item returned - Refund: '+(item.price*qty)+' SSP');}
function manualReturn(){let name=document.getElementById('retName').value.trim();let qty=Number(document.getElementById('retQty').value||0);let reason=document.getElementById('retReason').value.trim()||'Manual Return';if(!name||!qty)return alert('Enter medicine name and quantity');let m=meds.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!m)return alert('Medicine not found in stock. Add it first.');m.qty+=qty;let refund=m.price*qty;returns.push({id:Date.now(),date:new Date().toISOString().slice(0,10),name:m.name,qty,refund,reason,saleId:'Manual'});saveAll();renderReturns();renderStock();document.getElementById('retName').value='';document.getElementById('retQty').value='';document.getElementById('retReason').value='';alert('Manual return done - Refund: '+refund+' SSP');}
function addMed(){let name=document.getElementById('mName').value.trim();let price=Number(document.getElementById('mPrice').value||0);let qty=Number(document.getElementById('mQty').value||0);let expiry=document.getElementById('mExpiry').value;let barcode=document.getElementById('mBarcode').value.trim();if(!name||!price)return alert('Enter name and price');meds.push({id:Date.now(),name,price,qty,expiry,barcode});saveAll();renderStock();renderPOS();document.getElementById('mName').value='';document.getElementById('mPrice').value='';document.getElementById('mQty').value='';document.getElementById('mBarcode').value='';}
function renderStock(){document.getElementById('stockList').innerHTML=meds.map(m=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eef0ff"><div><b>${m.name}</b><br><small style="color:#6b7280">${m.price} SSP | ${m.qty} pcs | Exp: ${m.expiry||'-'} | ${getExpiryStatus(m)} | ${getStockDaysLeft(m)}</small></div><div><button class="btn-ghost" onclick="editMed('${m.id}')">Edit</button> <button class="btn-danger" onclick="deleteMed('${m.id}')">Delete</button></div></div>`).join('')||'Stock is empty';renderAlerts();}
function editMed(id){let m=meds.find(x=>String(x.id)===String(id));if(!m)return;let n=prompt('Name:',m.name);if(n===null)return;let pr=prompt('Price:',m.price);let q=prompt('Quantity:',m.qty);let ex=prompt('Expiry YYYY-MM-DD:',m.expiry||'');m.name=n;m.price=Number(pr);m.qty=Number(q);m.expiry=ex;saveAll();renderStock();renderPOS();alert('Updated');}
function deleteMed(id){if(!confirm('Are you sure to delete this medicine?'))return;meds=meds.filter(x=>String(x.id)!==String(id));saveAll();renderStock();renderPOS();}
function getExpiryStatus(m){if(!m.expiry)return 'No date';let diff=(new Date(m.expiry)-new Date())/86400000;if(diff<0)return 'Expired';if(diff<=60)return 'Expires in '+Math.ceil(diff)+' days';return 'OK';}
function getStockDaysLeft(m){if(m.qty<=5)return 'Low Stock';let avgQty=sales.slice(-30).reduce((s,x)=>s+x.items.reduce((a,i)=>a+i.qty,0),0)/30||1;let d=Math.floor(m.qty/avgQty);if(d<=60)return 'Will finish in ~'+d+' days';return 'Enough stock';}
function renderAlerts(){let box=document.getElementById('alertsBox');if(!box)return;let expired=meds.filter(m=>getExpiryStatus(m).includes('Expired'));let soon=meds.filter(m=>getExpiryStatus(m).includes('Expires'));let low=meds.filter(m=>m.qty<=5);box.innerHTML=`<p class="text-red">Expired: ${expired.length} - ${expired.map(m=>m.name).join(', ')||'None'}</p><p class="text-orange">Expires in 60 days: ${soon.length} - ${soon.map(m=>m.name).join(', ')||'None'}</p><p>Low Stock (<=5): ${low.length} - ${low.map(m=>m.name).join(', ')||'None'}</p>`;}
function renderReports(){let from=document.getElementById('repFrom').value;let to=document.getElementById('repTo').value;let list=sales.filter(s=>(!from||s.date>=from)&&(!to||s.date<=to));let completed=list.filter(s=>s.status!=='Returned');let totalSales=completed.reduce((s,x)=>s+(x.total||0),0);let totalReturns=returns.filter(r=>(!from||r.date>=from)&&(!to||r.date<=to)).reduce((s,x)=>s+(x.refund||0),0);let totalExp=expenses.filter(e=>(!from||e.date>=from)&&(!to||e.date<=to)).reduce((s,x)=>s+(x.amount||0),0);let cost=completed.reduce((s,x)=>s+x.items.reduce((a,i)=>a+(i.price*0.7*i.qty),0),0);let net=totalSales-cost-totalExp;document.getElementById('reportsOut').innerHTML=`<div class="kpi" style="margin-top:12px"><div style="background:#dcfce7">Sales<br>${totalSales} SSP</div><div style="background:#fee2e2">Returns<br>${totalReturns} SSP</div><div style="background:#fef3c7">Expenses<br>${totalExp} SSP</div><div style="background:#dbeafe">Net Profit<br>${Math.round(net)} SSP</div></div><p style="color:#6b7280">Invoices: ${completed.length} | Returned: ${list.length-completed.length} | Estimated Cost: ${Math.round(cost)} SSP</p><table><tr><th>Date</th><th>Items</th><th>Total</th><th>Status</th></tr>${list.map(s=>`<tr><td>${s.date}</td><td>${s.items.map(i=>i.name+' x'+i.qty).join(', ')}</td><td>${s.total}</td><td>${s.status||'Completed'}</td></tr>`).join('')}</table>`;renderMonthlyChart(completed);renderMonthlyCalendar();}
function renderMonthlyChart(list){let canvas=document.getElementById('monthlyChart');if(!canvas)return;let ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);let days=[...new Set(list.map(s=>s.date))].sort().slice(-14);if(!days.length){ctx.fillStyle='#6b7280';ctx.fillText('No sales in this period',20,50);return;}let max=Math.max(...days.map(d=>list.filter(s=>s.date===d).reduce((s,x)=>s+x.total,0)),1);ctx.fillStyle='#5658B5';days.forEach((d,i)=>{let v=list.filter(s=>s.date===d).reduce((s,x)=>s+x.total,0);let h=(v/max)*120;ctx.fillRect(10+i*30,160-h,18,h);ctx.fillStyle='#1e1e3a';ctx.fillText(v,8+i*30,175);ctx.fillStyle='#5658B5';});ctx.fillStyle='#6b7280';ctx.fillText('Sales - Last 14 days',10,195);}
function renderMonthlyCalendar(){let el=document.getElementById('monthlyCalendar');if(!el)return;let byDay={};sales.filter(s=>s.status!=='Returned').forEach(s=>{byDay[s.date]=(byDay[s.date]||0)+s.total;});el.innerHTML='<h4>Monthly Calendar</h4>'+Object.keys(byDay).sort().map(d=>`<span style="display:inline-block;background:#eef0ff;color:#5658B5;padding:6px 10px;border-radius:10px;margin:3px;font-weight:700">${d}: ${byDay[d]} SSP</span>`).join('')||'None';}
function addExpense(){let name=document.getElementById('eName').value.trim();let amt=Number(document.getElementById('eAmt').value||0);if(!name||!amt)return alert('Enter description and amount');expenses.push({id:Date.now(),name,amount:amt,date:new Date().toISOString().slice(0,10)});saveAll();renderExpenses();document.getElementById('eName').value='';document.getElementById('eAmt').value='';}
function renderExpenses(){let el=document.getElementById('expList');if(!el)return;el.innerHTML=expenses.map(e=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eef0ff"><span>${e.date} - ${e.name}</span><b>${e.amount} SSP</b></div>`).join('')||'No expenses';}
function addDebt(){let name=document.getElementById('dName').value.trim();let amt=Number(document.getElementById('dAmt').value||0);if(!name||!amt)return alert('Enter name and amount');debts.push({id:Date.now(),name,amount:amt,paid:0,date:new Date().toISOString().slice(0,10)});saveAll();renderDebts();}
function renderDebts(){let el=document.getElementById('debtsList');if(!el)return;el.innerHTML=debts.map(d=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eef0ff"><span>${d.name} - Remaining: ${d.amount-d.paid} SSP</span><button class="btn-ghost" onclick="savePayDebt('${d.id}')">Pay</button></div>`).join('')||'No debts';}
function savePayDebt(id){let d=debts.find(x=>String(x.id)===String(id));if(!d)return;let amt=Number(prompt('How much paid?',d.amount-d.paid));if(!amt)return;d.paid+=amt;expenses.push({id:Date.now(),name:'Debt Payment - '+d.name,amount:amt,date:new Date().toISOString().slice(0,10)});saveAll();renderDebts();renderExpenses();alert('Payment saved');}
let poRows=[{name:'',qty:1,price:0},{name:'',qty:1,price:0},{name:'',qty:1,price:0}];
function soAddRow(){poRows.push({name:'',qty:1,price:0});renderPO();}
function renderPO(){let el=document.getElementById('poRows');if(!el)return;el.innerHTML=poRows.map((r,i)=>`<div class="row"><input placeholder="Medicine Name" value="${r.name}" oninput="poRows[${i}].name=this.value"><input type="number" placeholder="Qty" value="${r.qty}" oninput="poRows[${i}].qty=Number(this.value)"><input type="number" placeholder="Price" value="${r.price}" oninput="poRows[${i}].price=Number(this.value)"></div>`).join('');}
function saveSalesOrder(){poRows.filter(r=>r.name.trim()).forEach(r=>{let ex=meds.find(m=>m.name.toLowerCase()===r.name.toLowerCase());if(ex){ex.qty+=r.qty;ex.price=r.price||ex.price;}else meds.push({id:Date.now()+Math.random(),name:r.name,price:r.price,qty:r.qty,expiry:'',barcode:''});});poRows=[{name:'',qty:1,price:0},{name:'',qty:1,price:0},{name:'',qty:1,price:0}];saveAll();renderPO();renderStock();alert('Purchase order saved to stock');}
function closeShift(){let today=new Date().toISOString().slice(0,10);let daySales=sales.filter(s=>s.date===today&&s.status!=='Returned').reduce((s,x)=>s+x.total,0);let dayReturns=returns.filter(r=>r.date===today).reduce((s,x)=>s+x.refund,0);let dayExp=expenses.filter(e=>e.date===today).reduce((s,x)=>s+x.amount,0);alert('Shift Closed\nSales Today: '+daySales+' SSP\nReturns Today: '+dayReturns+' SSP\nExpenses Today: '+dayExp+' SSP\nNet Cash: '+(daySales-dayReturns-dayExp)+' SSP');}
function init(){renderPOS();renderReturns();renderStock();renderReports();renderExpenses();renderDebts();renderPO();renderAlerts();showPage('reports',document.querySelectorAll('nav button')[3]);}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>
</body>
</html>
