<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Active Care - Add Medicine V2 - Local + Cloud</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui;padding:20px;background:#F1F5F4}
.box{max-width:460px;margin:30px auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.1)}
h1{font-size:20px;text-align:center}input,select{width:100%;padding:11px;border:1px solid #E2E8E6;border-radius:10px;margin-top:10px;font-size:14px}
.row{display:flex;gap:10px}.row>*{flex:1}
button{width:100%;padding:13px;border:none;border-radius:10px;font-weight:700;cursor:pointer;margin-top:12px}
.btn-pri{background:#0B6B5A;color:#fff}.btn-ghost{background:#E8EFED;color:#111}
.msg{font-size:13px;margin-top:10px;min-height:18px;text-align:center}
.sync-status{font-size:12px;text-align:center;padding:8px;border-radius:8px;background:#F8FAF9;margin-top:10px}
</style>
</head>
<body>
<div class="box">
<h1>Active Care - Add Medicine</h1>
<p style="font-size:12px;color:#6B7C7A;text-align:center">V2 - Saves to Local + Firebase Cloud</p>
<div id="syncStatus" class="sync-status">Checking Firebase...</div>
<input id="mName" placeholder="Medicine Name * e.g. Amoxicillin 250mg" maxlength="60">
<input id="mCategory" placeholder="Category e.g. Antibiotic" maxlength="30">
<div class="row">
<select id="mForm">
<option value="Tablets">Tablets</option>
<option value="Capsules">Capsules</option>
<option value="Syrup">Syrup</option>
<option value="Suspension">Suspension</option>
<option value="Injection">Injection</option>
<option value="Cream">Cream</option>
<option value="Ointment">Ointment</option>
<option value="Drops">Drops</option>
<option value="Eye Drops">Eye Drops</option>
<option value="Ear Drops">Ear Drops</option>
<option value="Spray">Spray</option>
<option value="Suppository">Suppository</option>
<option value="Sachet">Sachet</option>
<option value="Lotion">Lotion</option>
<option value="Gel">Gel</option>
<option value="Other">Other</option>
</select>
<select id="mUnit">
<option value="Strip">Strip</option>
<option value="Bottle">Bottle</option>
<option value="Box">Box</option>
<option value="Piece">Piece</option>
<option value="Tube">Tube</option>
<option value="Vial">Vial</option>
<option value="Ampoule">Ampoule</option>
<option value="Pack">Pack</option>
<option value="Sachet">Sachet</option>
</select>
</div>
<div class="row"><input id="mPrice" type="number" placeholder="Selling Price USD *" step="0.01"><input id="mCost" type="number" placeholder="Cost Price USD" step="0.01"></div>
<div class="row"><input id="mQty" type="number" placeholder="Qty *" value="0"><input id="mMin" type="number" placeholder="Min Stock" value="5"></div>
<input id="mExpiry" type="date">
<input id="mBarcode" placeholder="Barcode (optional)" maxlength="30">
<input id="mSupplier" placeholder="Supplier" maxlength="50">
<button class="btn-pri" onclick="addMed()">Add to Inventory - Local + Cloud</button>
<button class="btn-ghost" onclick="location.href='./index.html'">Go to Inventory</button>
<p id="msg" class="msg"></p>
<p style="font-size:11px;color:#6B7C7A;text-align:center">Rate: <span id="rateHint"></span> - Price in SSP is calculated automatically.</p>
</div>

<script>
let rate = Number(localStorage.getItem('ac13_rate')||4500);
document.getElementById('rateHint').innerText='1 USD = '+rate+' SSP';

async function addMed(){
  let msg=document.getElementById('msg');
  let name=document.getElementById('mName').value.trim();
  let priceUSD=Number(document.getElementById('mPrice').value);
  let costUSD=Number(document.getElementById('mCost').value||0);
  let qty=Number(document.getElementById('mQty').value||0);
  if(!name){msg.style.color='red';msg.innerText='Enter medicine name';return;}
  if(!priceUSD||priceUSD<=0){msg.style.color='red';msg.innerText='Enter valid selling price USD';return;}

  let med={
    id:Date.now(),
    name:name,
    category:document.getElementById('mCategory').value.trim(),
    barcode:document.getElementById('mBarcode').value.trim(),
    priceUSD:priceUSD, costUSD:costUSD,
    price:Math.round(priceUSD*rate), cost:Math.round(costUSD*rate),
    qty:qty, min:Number(document.getElementById('mMin').value||5),
    expiry:document.getElementById('mExpiry').value||'2027-01-01',
    supplier:document.getElementById('mSupplier').value.trim(),
    form:document.getElementById('mForm').value,
    unit:document.getElementById('mUnit').value
  };

  // 1. SAVE LOCAL - Always, so it works offline
  let meds=JSON.parse(localStorage.getItem('ac13_meds')||'[]');
  meds.push(med);
  localStorage.setItem('ac13_meds', JSON.stringify(meds));

  msg.style.color='black';
  msg.innerText='Saving Local OK... Now saving to Cloud...';

  // 2. SAVE CLOUD - Load cloud first, so we don't delete other data
  let cloudOk=false;
  try{
    if(window._db && window._fs){
      const {collection, setDoc, doc, getDoc} = window._fs;
      const ref = doc(collection(window._db,'activecare-single'),'data');
      const snap = await getDoc(ref);
      let cloud = snap.exists() ? snap.data() : {};
      // Merge: take cloud meds, add new med (avoid duplicate by id)
      let cloudMeds = cloud.meds || [];
      // If cloud meds is empty but local has meds, use local as base
      // If cloud has meds, use cloud as base and add new one
      let baseMeds = cloudMeds.length ? cloudMeds : meds.slice(0,-1);
      // Check if already exists
      if(!baseMeds.find(m=>m.id===med.id)){
        baseMeds.push(med);
      }
      await setDoc(ref, {
        ...cloud,
        meds: baseMeds,
        version: 'V13.1',
        updatedAt: new Date().toISOString()
      });
      cloudOk=true;
    } else {
      msg.style.color='orange';
      msg.innerText='Local saved OK, but Firebase not ready. Wait 3 sec and try again, or open index.html and click Sync Now.';
    }
  }catch(e){
    console.log('Cloud save failed', e);
    msg.style.color='red';
    msg.innerText='Local saved OK, Cloud failed: '+e.message+' - Open index.html and click Sync Now.';
    return;
  }

  if(cloudOk){
    msg.style.color='green';
    msg.innerText='SUCCESS! '+name+' - '+med.form+' - '+med.unit+' saved to Local + Cloud. All devices will see it now.';
  }
  document.getElementById('mName').value='';
  document.getElementById('mQty').value='0';
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, setDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
// PASTE SAME CONFIG AS index.html HERE - MUST BE SAME PROJECT
const firebaseConfig = {
  apiKey: "AIzaSyD0j6mn0PEaUvBgsVkE5Xr0Xzr5hXZ-4lQ",
  authDomain: "active-care-pharmacy-71ce2.firebaseapp.com",
  projectId: "active-care-pharmacy-71ce2",
  storageBucket: "active-care-pharmacy-71ce2.firebasestorage.app",
  messagingSenderId: "860436415161",
  appId: "1:860436415161:web:6aaa1ae3bdaec6c1559168"
};
try{
  const app = initializeApp(firebaseConfig);
  window._db = getFirestore(app);
  window._fs = { collection, setDoc, doc, getDoc };
  document.getElementById('syncStatus').innerText = 'Firebase Connected - Will save to Local + Cloud';
  document.getElementById('syncStatus').style.background = '#D1FAE5';
  console.log('Add Medicine V2 Firebase Connected');
}catch(e){
  document.getElementById('syncStatus').innerText = 'Firebase Offline - Will save to Local only. Check config.';
  document.getElementById('syncStatus').style.background = '#FEE2E2';
  console.log('Add Medicine V2 Offline', e);
}
</script>
</body>
  </html>
